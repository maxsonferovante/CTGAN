[project]
name = 'ctgan'
description = 'Create tabular synthetic data using a conditional GAN'
authors = [{ name = 'DataCebo, Inc.', email = 'info@sdv.dev' }]
classifiers = [
    'Development Status :: 2 - Pre-Alpha',
    'Intended Audience :: Developers',
    'Natural Language :: English',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Topic :: Scientific/Engineering :: Artificial Intelligence',
]
keywords = ['ctgan', 'CTGAN']
dynamic = ['version']
license = 'BUSL-1.1'
license-files = ['LICENSE']
requires-python = '>=3.11,<3.14'
readme = 'README.md'
dependencies = [
    "numpy>=2.4.6;python_version<'3.12'",
    "numpy>=2.5.3;python_version>='3.12'",
    "pandas>=3.0.5",
    "torch>=2.14.0",
    'tqdm>=4.70.1',
    "rdt>=1.22.0",
    "joblib>=1.6.0",
    "kagglehub[pandas-datasets]>=1.0.2",
]

[tool.uv.sources]
rdt = { path = "../rdt", editable = true }
torch = { index = "pytorch-cu126", marker = "sys_platform == 'win32'" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[project.urls]
"Source Code"= "https://github.com/sdv-dev/CTGAN/"
"Issue Tracker" = "https://github.com/sdv-dev/CTGAN/issues"
"Changes" = "https://github.com/sdv-dev/CTGAN/blob/main/HISTORY.md"
"Twitter" = "https://twitter.com/sdv_dev"
"Chat" = "https://forum.datacebo.com/"

[project.entry-points]
ctgan = { main = 'ctgan.cli.__main__:main' }

[project.optional-dependencies]
test = [
    'pytest>=9.1.1',
    'pytest-rerunfailures>=16.6.1,<17',
    'pytest-cov>=7.1.0',
    'pytest-runner>=6.0.1',
    'tomli>=2.4.1,<3',
]
dev = [
    'ctgan[test]',

    # general
    'pip>=26.2.1',
    'build>=1.6.1,<2',
    'bump-my-version>=1.5.1',
    'watchdog>=6.0.0,<7',

    # style check
    'ruff>=0.16.7,<1',

    # distribute on PyPI
    'twine>=7.0.0',
    'wheel>=0.48.0',

    # Advanced testing
    'coverage>=7.16.1,<8',

    'invoke>=3.0.3',
]
readme = ['rundoc>=0.4.5,<0.5',]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ['ctgan', 'ctgan.*']
namespaces = false

[tool.setuptools.package-data]
'*' = [
    'AUTHORS.rst',
    'CONTRIBUTING.rst',
    'HISTORY.md',
    'README.md',
    '*.md',
    '*.rst',
    'conf.py',
    'Makefile',
    'make.bat',
    '*.jpg',
    '*.png',
    '*.gif'
]

[tool.setuptools.exclude-package-data]
'*' = [
    '* __pycache__',
    '*.py[co]',
    'static_code_analysis.txt',
]

[tool.setuptools.dynamic]
version = {attr = 'ctgan.__version__'}

[tool.pytest.ini_options]
collect_ignore = ['pyproject.toml']

[tool.bumpversion]
current_version = "0.12.2.dev0"
parse = '(?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)(\.(?P<release>[a-z]+)(?P<candidate>\d+))?'
serialize = [
    '{major}.{minor}.{patch}.{release}{candidate}',
	'{major}.{minor}.{patch}'
]
search = '{current_version}'
replace = '{new_version}'
regex = false
ignore_missing_version = false
tag = true
sign_tags = false
tag_name = 'v{new_version}'
tag_message = 'Bump version: {current_version} → {new_version}'
allow_dirty = false
commit = true
message = 'Bump version: {current_version} → {new_version}'
commit_args = ''

[tool.bumpversion.parts.release]
first_value = 'dev'
optional_value = 'release'
values = [
    'dev',
    'release'
]

[[tool.bumpversion.files]]
filename = "ctgan/__init__.py"
search = "__version__ = '{current_version}'"
replace = "__version__ = '{new_version}'"

[build-system]
requires = ['setuptools', 'wheel']
build-backend = 'setuptools.build_meta'

[tool.ruff]
preview = true
line-length = 100
indent-width = 4
src = ["ctgan"]
target-version = "py311"
exclude = [
    "docs",
    ".tox",
    ".git",
    "__pycache__",
    ".ipynb_checkpoints",
    "tasks.py",
]

[tool.ruff.lint]
select = [
    # Pyflakes
    "F",
    # Pycodestyle
    "E",
    "W",
    # pydocstyle
    "D",
    # isort
    "I001",
    # print statements
    "T201",
    # pandas-vet
    "PD",
    # numpy 2.0
    "NPY201"
]
ignore = [
    # pydocstyle
    "D107",  # Missing docstring in __init__
    "D417",   # Missing argument descriptions in the docstring, this is a bug from pydocstyle: https://github.com/PyCQA/pydocstyle/issues/449
    "PD101",
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
preview = true
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint.isort]
known-first-party = ["ctgan"]
lines-between-types = 0

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402", "F403", "F405", "E501", "I001"]
"errors.py" = ["D105"]
"tests/**.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
max-doc-length = 100
max-line-length = 100
